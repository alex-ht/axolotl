# Nemotron-3 Super 120B-A12B full fine-tune with Expert Parallel (DeepEP).
# See examples/nemotron-h/README.md — LatentMoE comm dim is moe_latent_size=1024,
# not moe_intermediate_size=2688.
#
# 8-GPU node: ep=8, E_local=64. DeepEP requires E_local <= 128, so ep_size >= 4.
# For FSDP on the same 8 GPUs: expert_parallel_size: 4 and dp_shard_size: 2.
base_model: nvidia/NVIDIA-Nemotron-3-Super-120B-A12B-BF16

plugins:
  - axolotl.integrations.expert_parallel.ExpertParallelPlugin
  - axolotl.integrations.cut_cross_entropy.CutCrossEntropyPlugin

experts_implementation: grouped_mm
expert_parallel_size: 8
dp_shard_size: 1

# LoRA kernel patches are incompatible with this architecture — see README.
lora_mlp_kernel: false
lora_qkv_kernel: false
lora_o_kernel: false

chat_template: tokenizer_default
datasets:
  - path: mlabonne/FineTome-100k
    type: chat_template
    split: train[:20%]
    field_messages: conversations
    message_property_mappings:
      role: from
      content: value

val_set_size: 0.0
output_dir: ./outputs/nemotron3-super-ep
dataset_prepared_path: last_run_prepared

sequence_len: 4096
sample_packing: true

micro_batch_size: 1
gradient_accumulation_steps: 4
num_epochs: 1
optimizer: adamw_torch_8bit
lr_scheduler: cosine
learning_rate: 5.0e-6
warmup_ratio: 0.1

bf16: auto
tf32: true

gradient_checkpointing: true
gradient_checkpointing_kwargs:
  use_reentrant: false

attn_implementation: flash_attention_2
logging_steps: 1
saves_per_epoch: 1
weight_decay: 0.0
